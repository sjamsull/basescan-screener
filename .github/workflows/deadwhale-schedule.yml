name: Dead-Whale Scan

on:
  schedule:
    - cron: '0 */6 * * *'  # tiap 6 jam (fase akumulasi lambat, cukup jarang)
  workflow_dispatch:       # manual trigger

jobs:
  deadwhale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r collector/requirements.txt

      - name: Run dead-whale scan (base)
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DW_MIN_TOKEN_AGE_DAYS: 30
          DW_DEAD_TXNS_THRESHOLD: 5
          DW_LOOKBACK_DAYS: 30
        run: |
          python -m collector.processors.populate_universe --chain base --limit 50
          python -m collector.processors.dead_whale --chain base --limit 50
