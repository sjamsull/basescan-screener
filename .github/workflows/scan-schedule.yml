name: Token Scan Schedule

on:
  schedule:
    - cron: '0 * * * *'  # tiap jam
  workflow_dispatch:     # manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r collector/requirements.txt

      - name: Run full scan (all chains, both modes)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GOPLUS_API_KEY: ${{ secrets.GOPLUS_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHAIN_WEIGHT_ORDER: ${{ vars.CHAIN_WEIGHT_ORDER }}
        run: |
          python -m collector.main --limit 50