name: Token Scan Schedule

on:
  schedule:
    - cron: '0 * * * *'  # tiap jam
  workflow_dispatch:     # manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chain: base
            gmgn_key: GMGN_API_KEY_BASE
          - chain: robinhood
            gmgn_key: GMGN_API_KEY_ROBINHOOD
          # Aktifkan di bawah ini bila sudah siap scan 4 chain:
          # - chain: bsc
          #   gmgn_key: GMGN_API_KEY_BSC
          # - chain: sol
          #   gmgn_key: GMGN_API_KEY_SOL
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r collector/requirements.txt

      - name: Scan ${{ matrix.chain }}
        env:
          GMGN_API_KEY: ${{ secrets[matrix.gmgn_key] }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GOPLUS_API_KEY: ${{ secrets.GOPLUS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m collector.main --chains ${{ matrix.chain }} --limit 50

      - name: Backfill universe enrich (security + created_at)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m collector.backfill_universe_enrich

  backtest:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r collector/requirements.txt

      - name: Backtest tracker (follow active signals)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          GMGN_API_KEY_BASE: ${{ secrets.GMGN_API_KEY_BASE }}
          GMGN_API_KEY_ROBINHOOD: ${{ secrets.GMGN_API_KEY_ROBINHOOD }}
          GMGN_API_KEY_BSC: ${{ secrets.GMGN_API_KEY_BSC }}
          GMGN_API_KEY_SOL: ${{ secrets.GMGN_API_KEY_SOL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GOPLUS_API_KEY: ${{ secrets.GOPLUS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m collector.backtest --all
