<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD WHALE — Detector Token Potensial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg: #070d12;
    --surface: #0d161e;
    --surface-2: #111c26;
    --border: #1b2a35;
    --border-hot: #2a4152;
    --text: #d7e4ec;
    --muted: #5f7684;
    --green: #2dd4a0;
    --red: #ff5d5d;
    --amber: #ffb02e;
    --cyan: #39c2ff;
    --violet: #b48cff;
    --display: 'Space Grotesk', sans-serif;
    --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 3px; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -2;
    background:
      linear-gradient(rgba(57,194,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,194,255,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(700px 420px at 8% -5%, rgba(45,212,160,0.09), transparent 65%),
      radial-gradient(640px 400px at 96% 12%, rgba(57,194,255,0.07), transparent 65%),
      radial-gradient(560px 380px at 50% 108%, rgba(180,140,255,0.05), transparent 65%);
  }
  ::selection { background: rgba(45,212,160,0.3); }

  /* ── Header ─────────────────────────────── */
  .header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: rgba(7,13,18,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .logo {
    font-family: var(--display); font-weight: 700; font-size: 1.35rem;
    letter-spacing: -0.5px;
  }
  .logo em { font-style: normal; color: var(--green); }
  .logo .cursor {
    display: inline-block; width: 8px; height: 1.05rem; margin-left: 3px;
    background: var(--green); vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .brand-tag {
    font-family: var(--mono); font-size: 0.62rem; color: var(--muted);
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .chip {
    font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.8px;
    padding: 5px 11px; border-radius: 4px;
    border: 1px solid var(--border); color: var(--muted);
    background: var(--surface);
  }
  .chip.mode { border-color: rgba(180,140,255,0.4); color: var(--violet); }
  .chip.live { border-color: rgba(45,212,160,0.45); color: var(--green); display: flex; align-items: center; gap: 6px; }
  .chip.live i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: 0.35; transform: scale(0.7);} }

  /* ── Main ──────────────────────────────── */
  .main { max-width: 1460px; margin: 0 auto; padding: 26px 28px 60px; }

  /* ── Stat band (asymmetric) ─────────────── */
  .stat-band {
    display: grid; grid-template-columns: 1.5fr 2.2fr; gap: 14px;
    margin-bottom: 22px;
  }
  .hero-stat {
    grid-row: span 1;
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 24px;
    display: flex; align-items: center; gap: 26px;
    position: relative; overflow: hidden;
  }
  .hero-stat::after {
    content: ''; position: absolute; right: -40px; top: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(45,212,160,0.12), transparent 70%);
  }
  .hero-num {
    font-family: var(--mono); font-weight: 700; font-size: 3.4rem;
    line-height: 1; color: var(--green); letter-spacing: -2px;
  }
  .hero-meta .k {
    font-size: 0.64rem; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin-bottom: 6px;
  }
  .hero-meta .d { font-size: 0.78rem; color: var(--text); opacity: 0.85; max-width: 250px; }
  .hero-gauge { margin-left: auto; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .gauge-label {
    font-family: var(--mono); font-size: 0.54rem; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted); white-space: nowrap;
  }
  .mini-stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; display: flex; flex-direction: column; justify-content: center;
    transition: border-color 0.25s, transform 0.25s;
  }
  .mini-stat:hover { border-color: var(--border-hot); transform: translateY(-2px); }
  .mini-stat .v { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
  .mini-stat .k { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 4px; }
  .v.c-green { color: var(--green); } .v.c-cyan { color: var(--cyan); }
  .v.c-violet { color: var(--violet); } .v.c-amber { color: var(--amber); }

  /* ── Panel batang whale & akumulasi ────── */
  .chart-panel { display: flex; flex-direction: column; }
  .chart-panel h3 { margin-bottom: 12px; }
  .bchart {
    position: relative; height: 210px; margin: 2px 0 8px;
    background: linear-gradient(180deg, rgba(17,28,38,0.5), rgba(13,22,30,0.2));
    border: 1px solid var(--border-hot);
    border-top: 1px solid var(--border);
    border-radius: 6px;
  }
  .glines { position: absolute; inset: 0; pointer-events: none; }
  .gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(42,65,82,0.55); }
  .gridline.g0 { border-top-style: solid; border-color: var(--border-hot); }
  .gridline .gl {
    position: absolute; top: -8px;
    font-family: var(--mono); font-size: 0.54rem; color: var(--muted);
    white-space: nowrap; background: var(--surface);
    padding: 0 3px;
  }
  .gridline .gl.l { right: calc(100% + 6px); text-align: right; }
  .gridline .gl.r { left: calc(100% + 6px); text-align: left; }
  .gridline.g0 .gl { color: var(--border-hot); }
  .blar {
    position: absolute; inset: 14px 0 0;
    display: flex; align-items: flex-end; justify-content: space-around;
    gap: 8px; padding: 0 8px;
  }
  .bl-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
  .bl-plot { display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 100%; height: 100%; }
  .bl-bar {
    position: relative; height: 2px; width: 42%; max-width: 26px;
    border-radius: 3px 3px 0 0;
    background: rgba(57,194,255,0.35); border: 1px solid rgba(57,194,255,0.55);
    transition: height 0.8s cubic-bezier(0.22,1,0.36,1);
  }
  .bl-bar.bl-cnt { background: rgba(45,212,160,0.4); border-color: rgba(45,212,160,0.6); }
  .bl-bar.bl-usd { background: rgba(255,176,46,0.4); border-color: rgba(255,176,46,0.6); }
  .bl-bar span {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 0.52rem; white-space: nowrap;
  }
  .axis-row { display: flex; gap: 8px; padding: 0 8px; }
  .axis-row .ax {
    flex: 1; min-width: 0; text-align: center;
    font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--muted);
  }
  .charts-legend {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-family: var(--mono); font-size: 0.6rem; color: var(--muted);
  }
  .charts-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .charts-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .charts-legend .tot b { color: var(--text); font-weight: 600; }

  /* ── Command strip ──────────────────────── */
  .command {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 4px; }
  .tab {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.6px;
    padding: 7px 14px; border-radius: 5px; border: none; cursor: pointer;
    background: transparent; color: var(--muted);
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.on { background: rgba(45,212,160,0.14); color: var(--green); font-weight: 600; }
  .tab .n { opacity: 0.6; margin-left: 4px; }
  .search {
    flex: 1; min-width: 180px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 14px; color: var(--text); font-family: var(--mono); font-size: 0.75rem;
    outline: none; transition: border-color 0.2s;
  }
  .search:focus { border-color: var(--cyan); }
  .search::placeholder { color: var(--muted); }
  select.search { flex: 0 0 auto; cursor: pointer; }
  .view-title {
    font-family: var(--mono); font-size: 0.66rem; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .view-title::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* ── Cards ──────────────────────────────── */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; cursor: pointer; position: relative;
    transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
    opacity: 0; transform: translateY(14px);
    content-visibility: auto; contain-intrinsic-size: auto 250px;
  }
  .card.in { opacity: 1; transform: translateY(0); transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.22s, box-shadow 0.22s; }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hot);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(57,194,255,0.08);
  }
  .card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .rank { font-family: var(--mono); font-size: 0.66rem; color: var(--muted); padding-top: 5px; }
  .sym-block { flex: 1; min-width: 0; }
  .sym {
    font-family: var(--display); font-size: 1.35rem; font-weight: 700;
    letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px;
  }
  .sym a { font-size: 0.8rem; text-decoration: none; opacity: 0.55; transition: opacity 0.2s; }
  .sym a:hover { opacity: 1; }
  .tname { font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .rating {
    font-family: var(--mono); font-size: 0.62rem; font-weight: 600; letter-spacing: 0.8px;
    padding: 5px 10px; border-radius: 4px; white-space: nowrap;
  }
  .r-strong { background: rgba(45,212,160,0.15); color: var(--green); border: 1px solid rgba(45,212,160,0.35); }
  .r-buy { background: rgba(57,194,255,0.12); color: var(--cyan); border: 1px solid rgba(57,194,255,0.3); }
  .r-neutral { background: rgba(255,176,46,0.12); color: var(--amber); border: 1px solid rgba(255,176,46,0.3); }
  .r-sell { background: rgba(255,93,93,0.12); color: var(--red); border: 1px solid rgba(255,93,93,0.3); }

  .gauge { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .track { fill: none; stroke: var(--border); stroke-width: 6; }
  .gauge .fill { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(0.22,1,0.36,1); }
  .gauge .gv {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .gauge .gv b { font-family: var(--mono); font-size: 1.25rem; font-weight: 700; }
  .gauge .gv span { font-size: 0.5rem; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }

  .meta-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 12px 0; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border);
    margin-bottom: 12px;
  }
  .mg .k { font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 3px; }
  .mg .v { font-family: var(--mono); font-size: 0.78rem; font-weight: 600; }
  .mg.zt { border-left: 3px solid var(--border); border-radius: 0 4px 4px 0; padding: 4px 0 4px 8px; transition: background .25s, border-color .25s; }
  .mg.zt.z-good { border-left-color: var(--green); background: rgba(45,212,160,0.06); }
  .mg.zt.z-warn { border-left-color: var(--amber); background: rgba(255,176,46,0.07); }
  .mg.zt.z-bad  { border-left-color: var(--red);   background: rgba(255,93,93,0.08); }

  .hint {
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border);
    font-family: var(--mono); font-size: 0.58rem; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); text-align: right;
    transition: color 0.2s;
  }
  .card:hover .hint { color: var(--cyan); }

  .signal-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .sec-row { margin-top: 8px; }
  .sig {
    font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.4px;
    padding: 4px 9px; border-radius: 4px; border: 1px solid var(--border);
    color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
    text-decoration: none;
  }
  .sig a { color: inherit; text-decoration: none; }
  .sig.good { border-color: rgba(45,212,160,0.35); color: var(--green); background: rgba(45,212,160,0.06); }
  .sig.bad { border-color: rgba(255,93,93,0.35); color: var(--red); background: rgba(255,93,93,0.06); }
  .sig.warn { border-color: rgba(255,176,46,0.35); color: var(--amber); background: rgba(255,176,46,0.06); }
  .sig.info { border-color: rgba(57,194,255,0.3); color: var(--cyan); background: rgba(57,194,255,0.05); }

  .empty {
    text-align: center; padding: 70px 20px; color: var(--muted);
    font-family: var(--mono); font-size: 0.8rem;
  }

  /* ── Modal ──────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(4,8,11,0.78); backdrop-filter: blur(6px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 5vh 20px; overflow-y: auto;
  }
  .overlay.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  .modal {
    background: var(--surface); border: 1px solid var(--border-hot); border-radius: 12px;
    width: 100%; max-width: 880px; padding: 26px 30px;
    animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } }
  .modal-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .modal-head .sym { font-size: 1.7rem; }
  .modal-close {
    margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); width: 32px; height: 32px; cursor: pointer; font-size: 1rem;
    transition: all 0.2s;
  }
  .modal-close:hover { color: var(--red); border-color: var(--red); }
  .modal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .msec { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .msec h4 {
    font-family: var(--display); font-size: 0.64rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 10px;
  }
  .gline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 0.74rem; padding: 4px 0; line-height: 1.45; border-bottom: 1px solid rgba(27,42,53,0.55); }
  .gline .k { color: var(--muted); flex-shrink: 0; }
  .gline .v { font-family: var(--mono); font-weight: 600; min-width: 0; text-align: right; overflow-wrap: break-word; }
  .mtable { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.68rem; }
  .mtable th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--border); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.6px; }
  .mtable td { padding: 4px 6px; border-bottom: 1px solid rgba(27,42,53,0.5); }
  .mtable td.num, .mtable th.num { text-align: right; }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }

  footer {
    text-align: center; padding: 26px; color: var(--muted);
    font-family: var(--mono); font-size: 0.62rem; letter-spacing: 1px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--cyan); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 1000px) {
    .stat-band { grid-template-columns: 1fr 1fr; }
    .modal-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 620px) {
    .stat-band { grid-template-columns: 1fr; }
    .modal-grid { grid-template-columns: 1fr; }
    .main { padding: 18px 14px 50px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="logo">DEAD<em> WHALE</em><span class="cursor"></span></div>
    <div class="brand-tag">Token Potensial</div>
  </div>
  <div class="header-right">
    <span class="chip mode" id="mode-chip">MODE: BASE</span>
    <span class="chip live"><i></i>LIVE</span>
    <span class="chip" id="updated">Scan terakhir —</span>
  </div>
</div>

<div class="main">

  <!-- Chain switcher -->
  <div class="command">
    <div class="tabs" id="chain-tabs">
      <button class="tab on" data-chain="base">BASE</button>
      <button class="tab" data-chain="robinhood">ROBINHOOD</button>
    </div>
  </div>

  <!-- Stat band -->
  <div class="stat-band">
    <div class="hero-stat">
      <div class="hero-num" id="stat-token">0</div>
      <div class="hero-meta">
        <div class="k">Token Potensial</div>
        <div class="d">Token-token potensial</div>
      </div>
      <div class="hero-gauge">
        <span class="gauge-label">rata² akumulasi</span>
        <div class="gauge" id="hero-gauge">
          <svg width="76" height="76" viewBox="0 0 76 76">
            <circle class="track" cx="38" cy="38" r="31"></circle>
            <circle class="fill" cx="38" cy="38" r="31" stroke="var(--cyan)"></circle>
          </svg>
          <div class="gv"><b id="hero-avg">0</b></div>
        </div>
      </div>
    </div>
    <div class="panel chart-panel">
      <h3>Whale Posisi &amp; Akumulasi</h3>
      <div class="bchart">
        <div class="glines" id="glines"></div>
        <div class="blar" id="blar-area"></div>
      </div>
      <div class="axis-row" id="axis-row"></div>
      <div class="charts-legend" id="charts-legend"></div>
    </div>
  </div>

  <!-- Search + sort -->
  <div class="command">
    <input class="search" id="search" type="text" placeholder="⌕ cari symbol / address / wallet…">
    <select class="search" id="sort">
      <option value="rho">SORT: RATIO WHALE/MCAP ↓</option>
      <option value="whales">SORT: WHALE POSITIONS ↓</option>
      <option value="accum">SORT: AKUMULASI USD ↓</option>
      <option value="mcap">SORT: MCAP ↓</option>
      <option value="vol">SORT: VOL 24H ↓</option>
      <option value="holders">SORT: HOLDERS ↓</option>
      <option value="last">SORT: LAST SEEN ↓</option>
    </select>
  </div>

  <div class="view-title" id="view-title">› TOKEN POTENSIAL</div>
  <div id="cards-wrap"><div class="empty">Memuat…</div></div>

</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<footer>
  BASE &amp; ROBINHOOD · Dead-Whale Radar v2 · scan tiap 6 jam via GitHub Actions
  · <a href="https://github.com/sjamsull/basescan-screener" target="_blank">repo</a>
</footer>

<script>
const SUPABASE_URL = "https://tyqtxtgadxwrvbkktpiy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cXR4dGdhZHh3cnZia2t0cGl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTI0MDYsImV4cCI6MjEwMTUyODQwNn0.ukroYY74wVx1bCC7sa36I8AGKl5EVNB8MGv6tQ5JKKI";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const short = (a) => a ? (a.length>18 ? a.slice(0,6)+"…"+a.slice(-10) : a) : "—";
const fmt = (v,n=2) => v==null||v===""?"—":Number(v).toLocaleString(undefined,{maximumFractionDigits:n});
const fmtUsd = (v) => {
  v = Number(v||0);
  if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'K';
  return '$' + Math.round(v);
};
const ago = (ts) => {
  const t=new Date(ts); if(isNaN(t)) return "—";
  const s=Math.floor((Date.now()-t)/1000); if(s<0) return "baru";
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d?d+"d":(h?h+"h":" "+m+"m");
};
const gmgn = (a) => a ? `https://gmgn.ai/${CUR==='robinhood'?'robinhood':'base'}/token/${a.toLowerCase()}` : "#";
const arkm = (a) => a ? `https://arkm.com/explorer/address/${a}` : "#";
const C = 2 * Math.PI * 31;
const gaugeColor = v => v >= 70 ? 'var(--green)' : v >= 40 ? 'var(--amber)' : 'var(--red)';

async function q(table, params={}) {
  const u = new URL(SUPABASE_URL + "/rest/v1/" + table + "?");
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
  if (!r.ok) throw new Error(table + " " + r.status + " " + (await r.text()));
  return r.json();
}

/* ── state ── */
let CUR = 'base';
let DATA_U = [], POS_MAP = {};
let state = { q: '', sort: 'rho' };

const STATUS_META = {
  SIGNAL:  { cls: 'r-strong', label: 'SIGNAL' },
  CONFIRM: { cls: 'r-buy', label: 'CONFIRM' },
  WATCH:   { cls: 'r-neutral', label: 'WATCH' },
  DUMPED:  { cls: 'r-sell', label: 'DUMPED' },
};
function setGauge(el, score) {
  const fill = el.querySelector('.fill');
  fill.style.strokeDasharray = C;
  fill.style.strokeDashoffset = C;
  fill.style.stroke = gaugeColor(score);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.strokeDashoffset = C * (1 - score / 100);
  }));
}

/* ── agregasi per token ── */
function tokenStats(addr){
  const pos = POS_MAP[addr] || [];
  const accum = pos.reduce((s,p) => s + (Number(p.buy_usd)||0), 0);
  const buys  = pos.reduce((s,p) => s + (Number(p.buy_count)||0), 0);
  const sells = pos.reduce((s,p) => s + (Number(p.sell_count)||0), 0);
  const maxHold = pos.reduce((s,p) => Math.max(s, Number(p.hold_days)||0), 0);
  const strong = pos.filter(p => p.status === 'SIGNAL').length;
  return { pos, accum, buys, sells, maxHold, strong };
}

/* ── keamanan on-chain (GMGN security_json) ── */
function parseSec(t){
  if (!t || !t.security_json) return null;
  try { return JSON.parse(t.security_json); } catch(e) { return null; }
}
const pct = v => { const x = Number(v) || 0; return x > 1 ? x : x * 100; };
function secChips(sec){
  if (!sec) return '<span class="sig" title="data keamanan belum di-scan">SEC —</span>';
  const c = [];
  if (sec.is_honeypot) c.push('<span class="sig bad">⛔ HONEYPOT</span>');
  else c.push('<span class="sig good">✓ SELLABLE</span>');
  const tax = Math.max(Number(sec.buy_tax)||0, Number(sec.sell_tax)||0);
  if (tax > 0) c.push(`<span class="sig ${pct(tax) > 10 ? 'bad' : pct(tax) > 5 ? 'warn' : ''}">TAX ${pct(tax).toFixed(1)}%</span>`);
  const top10 = pct(sec.top_10_holder_rate);
  if (top10 > 0) c.push(`<span class="sig ${top10 > 60 ? 'bad' : top10 > 30 ? 'warn' : 'good'}">TOP10 ${top10.toFixed(0)}%</span>`);
  const rug = pct(sec.rug_ratio);
  if (rug > 0) c.push(`<span class="sig ${rug > 30 ? 'bad' : rug > 15 ? 'warn' : ''}">RUG ${rug.toFixed(0)}%</span>`);
  if (sec.owner_renounced === false) c.push('<span class="sig bad">⚠ NOT RENOUNCED</span>');
  else if (sec.owner_renounced) c.push('<span class="sig good">✓ RENOUNCED</span>');
  if (sec.open_source === false) c.push('<span class="sig warn">CLOSED SRC</span>');
  if (sec.is_blacklist) c.push('<span class="sig bad">⛔ BLACKLIST</span>');
  if (sec.is_show_alert) c.push('<span class="sig bad">⚠ GMGN ALERT</span>');
  (sec.flags || []).slice(0,2).forEach(f => c.push(`<span class="sig warn">${esc(f)}</span>`));
  return c.join('');
}

/* ── render kartu token ── */
function renderTokens(list){
  const wrap = $('cards-wrap');
  if(!list.length){ wrap.innerHTML = '<div class="empty">Belum ada token potensial untuk chain ini. Scan berikutnya dalam 6 jam.</div>'; return; }
  wrap.innerHTML = `<div class="cards">` + list.map((t,i)=>{
    const ts = tokenStats(t.token_address);
    const risk = t.risk_flags ? `<span class="sig warn" title="${esc(t.risk_flags)}">⚠ ${esc(t.risk_flags.split(',').slice(0,2).join(','))}</span>` : '';
    const lastSeen = Math.round((Date.now() - new Date(t.last_seen).getTime()) / 86400000);
    return `
    <div class="card in" data-idx="${i}" onclick="openToken('${t.token_address}')">
      <div class="card-top">
        <div class="rank">#${String(i+1).padStart(2,'0')}</div>
        <div class="sym-block">
          <div class="sym">${esc(t.symbol||'—')} <a href="${gmgn(t.token_address)}" target="_blank" rel="noopener" title="Buka di GMGN" onclick="event.stopPropagation()">↗</a></div>
          <div class="tname">${short(t.token_address)}</div>
        </div>
        <span class="rating ${ts.pos.length ? 'r-buy' : 'r-neutral'}">${ts.pos.length ? 'POTENSIAL' : 'KANDIDAT'}</span>
      </div>
      <div class="meta-grid">
        <div class="mg"><div class="k">Market Cap</div><div class="v">${fmtUsd(t.market_cap)}</div></div>
        <div class="mg"><div class="k">Vol 24h</div><div class="v">${fmtUsd(t.volume_24h)}</div></div>
        <div class="mg"><div class="k">Holders</div><div class="v">${fmt(t.holders,0)}</div></div>
        <div class="mg"><div class="k">Last Seen</div><div class="v">${isNaN(lastSeen) ? '—' : lastSeen + 'd'}</div></div>
      </div>
      <div class="signal-row">
        <span class="sig info">◈ ${CUR==='robinhood'?'ROBINHOOD':'BASE'}</span>
        <a class="sig info" href="${gmgn(t.token_address)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">gmgn ↗</a>
        ${risk}
      </div>
      <div class="signal-row sec-row">
        ${secChips(parseSec(t))}
      </div>
      <div class="hint">KLIK → ANALISIS &amp; DETIL WHALE</div>
    </div>`;
  }).join('') + '</div>';
}

/* ── filter + sort ── */
function filtered(){
  const ql = state.q.toLowerCase();
  let list = DATA_U;
  if (ql) list = list.filter(t => {
    const ts = tokenStats(t.token_address);
    return (t.token_address||'').toLowerCase().includes(ql) ||
           (t.symbol||'').toLowerCase().includes(ql) ||
           ts.pos.some(p => (p.wallet||'').toLowerCase().includes(ql));
  });
  const sorters = {
    rho:     (a,b) => whaleRatio(b) - whaleRatio(a),
    whales:  (a,b) => tokenStats(b.token_address).pos.length - tokenStats(a.token_address).pos.length,
    accum:   (a,b) => tokenStats(b.token_address).accum - tokenStats(a.token_address).accum,
    mcap:    (a,b) => (Number(b.market_cap)||0) - (Number(a.market_cap)||0),
    vol:     (a,b) => (Number(b.volume_24h)||0) - (Number(a.volume_24h)||0),
    holders: (a,b) => (Number(b.holders)||0) - (Number(a.holders)||0),
    last:    (a,b) => (b.last_seen||'').localeCompare(a.last_seen||''),
  };
  const whaleRatio = t => {
    const acc = tokenStats(t.token_address).accum;
    return t.market_cap ? acc / t.market_cap : 0;
  };
  return list.sort(sorters[state.sort] || sorters.rho);
}

/* ── stats ── */
function refreshStats(){
  let buy = 0, maxAccum = 1;
  DATA_U.forEach(t => {
    const ts = tokenStats(t.token_address);
    buy += ts.accum;
    maxAccum = Math.max(maxAccum, ts.accum);
  });
  $('stat-token').textContent = DATA_U.length;
  const avg = DATA_U.length ? Math.round(DATA_U.reduce((s,t) => s + Math.min(100, tokenStats(t.token_address).accum / maxAccum * 100), 0) / DATA_U.length) : 0;
  setGauge($('hero-gauge'), avg);
  $('hero-avg').textContent = avg;
  $('view-title').textContent = `› TOKEN POTENSIAL · ${CUR==='robinhood'?'ROBINHOOD':'BASE'}`;
  buildChart();
}
function buildChart(){
  const order = [ ['SIGNAL','var(--green)'], ['CONFIRM','var(--cyan)'], ['WATCH','var(--amber)'], ['DUMPED','var(--red)'] ];
  const row = {};
  let totalPos = 0, totalUsd = 0;
  DATA_U.forEach(t => (POS_MAP[t.token_address]||[]).forEach(p => {
    row[p.status] = row[p.status] || { n: 0, usd: 0 };
    row[p.status].n++;
    row[p.status].usd += Number(p.buy_usd)||0;
    totalPos++; totalUsd += Number(p.buy_usd)||0;
  }));
  const maxN = Math.max(1, ...order.map(([k]) => (row[k]?.n)||0));
  const maxU = Math.max(1, ...order.map(([k]) => (row[k]?.usd)||0));
  const cN = n => n >= 1e6 ? (n/1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n/1e3) + 'K' : n;

  const ticks = [0, .25, .5, .75, 1];
  $('glines').innerHTML = ticks.map((f,i) => `
    <div class="gridline${f === 0 ? ' g0' : ''}" style="top:${f * 100}%">
      <span class="gl l">${cN(Math.round(maxN * f))}</span>
      <span class="gl r">${fmtUsd(maxU * f)}</span>
    </div>`).join('');

  $('blar-area').innerHTML = order.map(([k]) => {
    const d = row[k] || { n: 0, usd: 0 };
    const hN = Math.max(2, Math.round(d.n / maxN * 100));
    const hU = Math.max(2, Math.round(d.usd / maxU * 100));
    return `
    <div class="bl-col">
      <div class="bl-plot">
        <div class="bl-bar bl-cnt" style="height:${hN}%"><span>${d.n}</span></div>
        <div class="bl-bar bl-usd" style="height:${hU}%"><span>${hU >= 30 ? fmtUsd(d.usd) : ''}</span></div>
      </div>
    </div>`;
  }).join('');

  $('axis-row').innerHTML = order.map(([k]) => `<div class="ax">${k}</div>`).join('');
  $('charts-legend').innerHTML =
    `<span class="lg"><i style="background:var(--green)"></i>posisi</span>
     <span class="lg"><i style="background:var(--amber)"></i>akumulasi</span>
     <span class="tot">✓ <b>${totalPos}</b> posisi · <b>${fmtUsd(totalUsd)}</b></span>`;
}

/* ── render pipeline ── */
function render(){
  renderTokens(filtered());
  $('updated').textContent = `Scan terakhir ${new Date().toLocaleTimeString()}`;
}

/* ── modal ── */
function openModal(title, bodyHTML){
  $('modal').innerHTML = `
    <div class="modal-head">
      <div class="sym-block">
        <div class="sym">${title}</div>
        <div class="tname" id="m-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${bodyHTML}`;
  $('overlay').classList.add('open');
}
async function openToken(addr){
  const t = (DATA_U.find(x => x.token_address === addr)) || {};
  openModal(esc(t.symbol || '—'), '<div class="empty">Memuat…</div>');
  $('m-sub').textContent = short(addr);
  try{
    const [uni, pos] = await Promise.all([
      q('dead_token_universe', {select:'*', token_address: `eq.${addr}`, chain: `eq.${CUR}`}),
      q('whale_positions', {select:'*', token_address: `eq.${addr}`, chain: `eq.${CUR}`})
    ]);
    const u = uni[0] || {};
    const posHtml = pos.length ? `
      <table class="mtable">
        <thead><tr><th>Wallet</th><th>Status</th><th class="num">Buy</th><th class="num">Sell</th><th class="num">USD</th><th class="num">Hold</th><th>Arkham</th></tr></thead>
        <tbody>${pos.map(p => `
          <tr><td>${short(p.wallet)}</td><td><span class="rating ${(STATUS_META[p.status]||STATUS_META.WATCH).cls}" style="padding:2px 7px">${p.status||'WATCH'}</span></td>
          <td class="num">${fmt(p.buy_count,0)}</td><td class="num">${fmt(p.sell_count,0)}</td>
          <td class="num ok">${fmtUsd(p.buy_usd)}</td><td class="num">${fmt(p.hold_days,1)}d</td>
          <td><a class="sig info" style="padding:2px 6px" href="${arkm(p.wallet)}" target="_blank">ark ↗</a></td></tr>`).join('')}</tbody>
      </table>` : '<div class="empty" style="padding:20px 10px">Belum ada whale position tercatat.</div>';
    $('modal').innerHTML += `
      <div class="modal-grid">
        <div class="msec">
          <h4>Overview</h4>
          <div class="gline"><span class="k">Symbol</span><b class="v">${esc(u.symbol||'—')}</b></div>
          <div class="gline"><span class="k">Market cap</span><b class="v">${fmtUsd(u.market_cap)}</b></div>
          <div class="gline"><span class="k">Volume 24h</span><b class="v">${fmtUsd(u.volume_24h)}</b></div>
          <div class="gline"><span class="k">Holders</span><b class="v">${fmt(u.holders,0)}</b></div>
          <div class="gline"><span class="k">Chain</span><b class="v">${CUR==='robinhood'?'ROBINHOOD':'BASE'}</b></div>
          ${u.risk_flags ? `<div class="gline"><span class="k">Risk</span><b class="v warn">${esc(u.risk_flags)}</b></div>` : ''}
        </div>
        <div class="msec">
          <h4>Security On-Chain</h4>
          ${(() => {
            const s = parseSec(u);
            if (!s) return '<div class="empty" style="padding:14px 6px">Belum ada data keamanan di-scan.</div>';
            const row = (k, v, cls='') => `<div class="gline"><span class="k">${k}</span><b class="v ${cls}">${v}</b></div>`;
            const adv = a => a ? '<span class="ok">ADA</span>' : '<span class="bad">TIDAK</span>';
            let h = '';
            h += row('Honeypot', s.is_honeypot ? '<span class="bad">⚠ YA</span>' : '<span class="ok">AMAN</span>');
            h += row('Buy tax', pct(s.buy_tax).toFixed(2) + '%', pct(s.buy_tax) > 10 ? 'warn' : '');
            h += row('Sell tax', pct(s.sell_tax).toFixed(2) + '%', pct(s.sell_tax) > 10 ? 'warn' : '');
            h += row('Top10 holders', pct(s.top_10_holder_rate).toFixed(1) + '%', pct(s.top_10_holder_rate) > 60 ? 'warn' : '');
            h += row('Rug ratio', pct(s.rug_ratio).toFixed(1) + '%', pct(s.rug_ratio) > 30 ? 'warn' : '');
            h += row('Owner renounced', s.owner_renounced === false ? '<span class="bad">TIDAK</span>' : '<span class="ok">YA</span>');
            h += row('Open source', s.open_source === false ? '<span class="bad">TIDAK</span>' : '<span class="ok">YA</span>');
            h += row('Blacklist', adv(s.is_blacklist));
            h += row('GMGN alert', s.is_show_alert ? '<span class="bad">YA</span>' : '<span class="ok">TIDAK</span>');
            if (s.burnt) h += row('Burnt', esc(String(s.burnt)));
            if ((s.flags || []).length) h += row('Flags', esc((s.flags || []).join(', ')));
            return h;
          })()}
        </div>
        <div class="msec" style="grid-column:span 2">
          <h4>Whale Positions (${pos.length})</h4>
          ${posHtml}
        </div>
      </div>
      <div class="signal-row" style="margin-top:16px">
        <a class="sig info" href="${gmgn(addr)}" target="_blank">Buka di GMGN ↗</a>
      </div>`;
  }catch(e){
    $('modal').innerHTML += '<div class="empty">⚠ ' + esc(e.message) + '</div>';
  }
}
function closeModal(){ $('overlay').classList.remove('open'); }

/* ── chain / events ── */
function setChain(name){
  CUR = name;
  document.querySelectorAll('#chain-tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.chain === name));
  $('mode-chip').textContent = 'MODE: ' + (name==='robinhood' ? 'ROBINHOOD' : 'BASE');
  load();
}
document.querySelectorAll('#chain-tabs .tab').forEach(b => b.onclick = () => setChain(b.dataset.chain));
$('search').addEventListener('input', debounce(e => { state.q = e.target.value; render(); }, 150));
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeModal(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

let lastSig = '';
function dataSig() {
  return (CUR + '|' + DATA_U.length + '|' + DATA_U.map(t => t.token_address).join(','));
}

async function load(){
  try{
    const ch = { chain: `eq.${CUR}` };
    const [u,w] = await Promise.allSettled([
      q('dead_token_universe', {...ch, order: 'last_seen.desc', limit: '150'}),
      q('whale_positions', {...ch, order: 'buy_usd.desc', limit: '200'})
    ]);
    const ur = u.status === 'fulfilled' ? u.value : [];
    const wr = w.status === 'fulfilled' ? w.value : [];
    if (u.status === 'rejected') throw new Error(u.reason.message);
    if (w.status === 'rejected') throw new Error(w.reason.message);
    DATA_U = ur;
    POS_MAP = {};
    wr.forEach(p => { (POS_MAP[p.token_address] = POS_MAP[p.token_address] || []).push(p); });
    const sig = dataSig();
    if (sig === lastSig) {
      $('updated').textContent = `Scan terakhir ${new Date().toLocaleTimeString()}`;
      return;
    }
    lastSig = sig;
    refreshStats();
    render();
  }catch(e){
    $('cards-wrap').innerHTML = '<div class="empty">⚠ ' + esc(e.message) + '</div>';
  }
}
load(); setInterval(load, 60000);
</script>
